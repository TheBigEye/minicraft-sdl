# Builds a stable release.
#
# Dispatch with a version like v1.0.0 (must match source/version.h).
# The changelog is cumulative for the whole vX.Y.Z-devN series: it
# spans every commit since the previous stable tag, so nothing is
# duplicated or lost between the pre-releases. The 8 variants are
# rebuilt from the current HEAD and published as a normal GitHub
# release tagged with the given version.
name: Make release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version (vX.Y.Z, e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

# Only one publishing workflow at a time (group shared with make-snapshot.yml).
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate version & changelog
    runs-on: ubuntu-latest
    outputs:
      file_version: ${{ steps.meta.outputs.file_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, needed for the changelog

      - name: Validate input and generate changelog
        id: meta
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # --- 1. Format: vX.Y.Z ----------------------------------------------
          if ! printf '%s\n' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$VERSION' - expected vX.Y.Z (e.g. v1.0.0)"
            exit 1
          fi

          # --- 2. Duplicate tag ----------------------------------------------
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

          # --- 3. Version must match source/version.h -------------------------
          HVER="$(sed -n \
            -e 's/^#define MAJOR \([0-9][0-9]*\).*/\1./p' \
            -e 's/^#define MINOR \([0-9][0-9]*\).*/\1./p' \
            -e 's/^#define PATCH \([0-9][0-9]*\).*/\1/p' source/version.h | tr -d '\n')"
          if [ "v$HVER" != "$VERSION" ]; then
            echo "::error::$VERSION does not match source/version.h (v$HVER) - bump the header first"
            exit 1
          fi

          # --- 4. Changelog start point --------------------------------------
          # Newest stable tag below this version. Every dev changelog of the
          # series started there, so PREV..HEAD is the cumulative range of the
          # whole vX.Y.Z-devN series (plus anything committed after the last
          # pre-release) with no duplicated entries.
          PREV="$(git tag --list 'v*' | grep -Ev -- '-dev[0-9]+$' | grep -vx "$VERSION" | sort -V | tail -n1 || true)"
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          echo "Changelog range: $RANGE"

          # Pre-releases of this series, for the release notes only.
          mapfile -t DEVS < <(git tag --list "${VERSION}-dev*" | sort -V)
          FIRST_DEV=""; LAST_DEV=""
          if [ "${#DEVS[@]}" -gt 0 ]; then
            FIRST_DEV="${DEVS[0]}"
            LAST_DEV="${DEVS[-1]}"
          fi

          # --- 5. Changelog (grouped by the leading word of each subject) ----
          added=""; changed=""; fixed=""; removed=""; count=0
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            count=$((count + 1))
            hash="${line%%	*}"
            subject="${line#*	}"
            entry="- ${subject} (${hash})"
            first="$(printf '%s' "$subject" | awk '{print tolower($1)}' | tr -d ':')"
            case "$first" in
              add|adds|added|feat|feature|implement|implements|introduce|include|includes|support)
                added="${added}${entry}"$'\n' ;;
              fix|fixes|fixed|repair|resolve|correct)
                fixed="${fixed}${entry}"$'\n' ;;
              remove|removes|removed|delete|drop|revert)
                removed="${removed}${entry}"$'\n' ;;
              *)
                changed="${changed}${entry}"$'\n' ;;
            esac
          done < <(git log --no-merges --reverse --pretty=tformat:'%h	%s' "$RANGE")

          {
            echo "## Changes"
            echo
            if [ "$count" -eq 0 ]; then
              echo "_No commits since ${PREV:-the beginning of history}._"
            else
              if [ -n "$added" ];   then echo "### Added";   printf '%s\n' "$added";   fi
              if [ -n "$changed" ]; then echo "### Changed"; printf '%s\n' "$changed"; fi
              if [ -n "$fixed" ];   then echo "### Fixed";   printf '%s\n' "$fixed";   fi
              if [ -n "$removed" ]; then echo "### Removed"; printf '%s\n' "$removed"; fi
            fi
            echo
            echo "---"
            echo "Stable release of the \`$VERSION\` series."
            if [ -n "$FIRST_DEV" ]; then
              if [ "$FIRST_DEV" = "$LAST_DEV" ]; then
                echo "Includes everything shipped in \`$FIRST_DEV\`."
              else
                echo "Cumulative changelog of the pre-releases \`$FIRST_DEV\` ... \`$LAST_DEV\` (plus any later commits)."
              fi
            else
              echo "No pre-releases were published for this series."
            fi
            if [ -n "$PREV" ]; then
              echo
              echo "Commits since \`$PREV\` - [compare](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV}...${VERSION})"
            fi
          } > changelog.md

          echo "file_version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "Release $VERSION - changelog from ${PREV:-<root>}, $count commits, ${#DEVS[@]} pre-releases" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: changelog.md

  build:
    name: Build ${{ matrix.backend }}-${{ matrix.arch }} (${{ matrix.os_name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Windows (MSYS2/MinGW, static exe, with sound) ----
          - os: windows-latest
            os_name: Windows
            kind: msys2
            msystem: MINGW64
            packages: mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2
            cc: gcc
            make_args: ""
            backend: SDL2
            arch: x64
            ext: exe
          - os: windows-latest
            os_name: Windows
            kind: msys2
            msystem: MINGW64
            packages: mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL
            cc: gcc
            make_args: SDL=1
            backend: SDL1
            arch: x64
            ext: exe
          # ---- Windows SDL3 ----
          # MSYS2 ships SDL3 for MINGW64 only: there is no mingw-w64-i686-sdl3
          # at all, so the 32-bit build compiles the library from source in a
          # step of its own (see sdl3_source below).
          - os: windows-latest
            os_name: Windows
            kind: msys2
            msystem: MINGW64
            packages: mingw-w64-x86_64-gcc mingw-w64-x86_64-sdl3
            cc: gcc
            make_args: SDL=3
            backend: SDL3
            arch: x64
            ext: exe
          - os: windows-latest
            os_name: Windows
            kind: msys2
            msystem: MINGW32
            packages: mingw-w64-i686-gcc mingw-w64-i686-cmake
            cc: gcc
            make_args: SDL=3
            backend: SDL3
            arch: i686
            ext: exe
            sdl3_source: release-3.2.20
          - os: windows-latest
            os_name: Windows
            kind: msys2
            msystem: MINGW32
            packages: mingw-w64-i686-gcc mingw-w64-i686-SDL2
            cc: gcc
            make_args: ""
            backend: SDL2
            arch: i686
            ext: exe
          - os: windows-latest
            os_name: Windows
            kind: msys2
            msystem: MINGW32
            packages: mingw-w64-i686-gcc mingw-w64-i686-SDL
            cc: gcc
            make_args: SDL=1
            backend: SDL1
            arch: i686
            ext: exe
          # ---- Linux (framebuffer builds: fbcon for SDL1, KMSDRM for SDL2) ----
          - os: ubuntu-latest
            os_name: Linux
            kind: apt
            apt: libsdl2-dev
            cc: gcc
            make_args: FB=1
            backend: SDL2
            arch: x64
            ext: elf
          - os: ubuntu-latest
            os_name: Linux
            kind: apt
            apt: libsdl1.2-dev
            cc: gcc
            make_args: SDL=1 FB=1
            backend: SDL1
            arch: x64
            ext: elf
          - os: ubuntu-latest
            os_name: Linux
            kind: sysroot
            debs: libsdl2-dev libsdl2-2.0-0
            cc: gcc -m32
            make_args: FB=1
            backend: SDL2
            arch: i686
            ext: elf
          # ---- Linux SDL3 ----
          # Ubuntu only packages libsdl3-dev from 25.10 (questing) onwards, so
          # these two run on a newer image than the SDL1/SDL2 jobs. The build
          # is pinned with SDL=3 on purpose: the Makefile stops with an error
          # if the library is missing instead of quietly falling back to SDL2
          # and shipping a binary labelled SDL3.
          - os: ubuntu-26.04
            os_name: Linux
            kind: apt
            apt: libsdl3-dev
            cc: gcc
            make_args: SDL=3 FB=1
            backend: SDL3
            arch: x64
            ext: elf
          - os: ubuntu-26.04
            os_name: Linux
            kind: sysroot
            debs: libsdl3-dev libsdl3-0
            cc: gcc -m32
            make_args: SDL=3 FB=1
            backend: SDL3
            arch: i686
            ext: elf
          - os: ubuntu-latest
            os_name: Linux
            kind: sysroot
            debs: libsdl1.2-dev libsdl1.2debian libsdl2-2.0-0
            cc: gcc -m32
            make_args: SDL=1 FB=1
            backend: SDL1
            arch: i686
            ext: elf
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (MSYS2)
        if: matrix.kind == 'msys2'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            make
            ${{ matrix.packages }}

      # MSYS2 has no 32-bit SDL3 package, so the i686 build compiles the
      # library itself. SDL3 is a CMake project with no mandatory external
      # dependencies for the video and audio backends Minicraft uses.
      - name: Build SDL3 from source (MSYS2 i686)
        if: matrix.sdl3_source != ''
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ matrix.sdl3_source }}" https://github.com/libsdl-org/SDL.git sdl3
          cmake -S sdl3 -B sdl3/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$MINGW_PREFIX" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF
          cmake --build sdl3/build --parallel "$(nproc)"
          cmake --install sdl3/build

      - name: Install dependencies (Linux)
        if: matrix.kind == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Build
        if: matrix.kind == 'apt'
        run: make CC="${{ matrix.cc }}" ${{ matrix.make_args }} -j"$(nproc)"

      # i386 SDL dev packages cannot be installed with apt on the runners:
      # their glib dependency chain has no i386 build on ubuntu-24.04. The
      # .debs are downloaded and extracted into a local sysroot instead;
      # gcc-multilib provides the 32-bit C runtime and headers.
      - name: Install dependencies (Linux i686)
        if: matrix.kind == 'sysroot'
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
          mkdir -p sysroot
          for p in ${{ matrix.debs }}; do
            apt-get download "$p:i386"
          done
          for d in *.deb; do
            dpkg -x "$d" sysroot
          done

      # --allow-shlib-undefined: the i386 SDL2 .so references X11, Wayland,
      # PulseAudio, etc., which are not in the sysroot and make the ubuntu
      # linker report SDL2's own unresolved references as errors. They are
      # satisfied at runtime by the SDL2 package dependencies; symbols used
      # by the game itself are still checked.
      - name: Build (Linux i686)
        if: matrix.kind == 'sysroot'
        env:
          C_INCLUDE_PATH: ${{ github.workspace }}/sysroot/usr/include:${{ github.workspace }}/sysroot/usr/include/i386-linux-gnu
          LIBRARY_PATH: ${{ github.workspace }}/sysroot/usr/lib/i386-linux-gnu
          LDFLAGS: -Wl,--allow-shlib-undefined
        run: make CC="${{ matrix.cc }}" ${{ matrix.make_args }} -j"$(nproc)"

      - name: Build (MSYS2)
        if: matrix.kind == 'msys2'
        shell: msys2 {0}
        run: make CC="${{ matrix.cc }}" ${{ matrix.make_args }} -j"$(nproc)"

      - name: Rename binary
        shell: bash
        run: |
          src="game"
          if [ "${{ matrix.ext }}" = "exe" ]; then src="game.exe"; fi
          mv "$src" "minicraft_${{ needs.prepare.outputs.file_version }}_${{ matrix.backend }}-${{ matrix.arch }}.${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: minicraft_${{ needs.prepare.outputs.file_version }}_${{ matrix.backend }}-${{ matrix.arch }}.${{ matrix.ext }}
          path: minicraft_*

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: minicraft_*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: changelog
          path: meta

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body_path: meta/changelog.md
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/*
